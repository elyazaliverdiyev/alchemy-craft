name: Keep Supabase Awake

on:
  schedule:
    # Run every 3 days at 08:00 UTC to prevent Supabase inactivity pause
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" \
            -H "apikey: sb_publishable_bmw71GhgQ24MoXaWq4fhSg_WU7YBmlG" \
            -H "Authorization: Bearer sb_publishable_bmw71GhgQ24MoXaWq4fhSg_WU7YBmlG" \
            "https://tsnnckbvxokjmbgfeqdj.supabase.co/rest/v1/promo_codes?select=code&limit=1"
